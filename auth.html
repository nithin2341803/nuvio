<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvio — Sign in</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#102039;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #d9e2ed;border-radius:28px;padding:34px;box-shadow:0 25px 70px #17385a18}.logo{font-size:28px;font-weight:900;letter-spacing:-.08em;text-decoration:none;color:#102039}.logo span{color:#146cff}.eyebrow{margin-top:45px;font-size:10px;letter-spacing:.16em;color:#71839a}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3f8;padding:4px;border-radius:12px;margin:14px 0 22px}.tabs button{border:0;background:transparent;padding:11px;border-radius:9px;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;box-shadow:0 2px 8px #17385a12}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:10px;font-weight:800;letter-spacing:.08em;color:#667891}.field input{padding:14px;border:1px solid #d6e0eb;border-radius:12px;font:inherit}.submit{width:100%;border:0;background:#146cff;color:#fff;border-radius:999px;padding:14px;font-weight:900;cursor:pointer;margin-top:10px}.msg{min-height:22px;font-size:12px;color:#687a92;margin-top:15px;line-height:1.5}.back{display:block;margin-top:20px;color:#687a92;font-size:12px;text-decoration:none}.small{font-size:11px;color:#8795a8;margin-top:18px;line-height:1.5}</style></head><body><main class="card"><a class="logo" href="index.html">nuvio<span>°</span></a><div class="eyebrow">STARTER / CUSTOMER ACCOUNT</div><h1 id="title">Welcome back.</h1><div class="tabs"><button id="signinTab" class="active">Sign in</button><button id="signupTab">Create account</button></div><form id="form"><div class="field" id="nameWrap" style="display:none"><label>NAME</label><input id="name" type="text" autocomplete="name" placeholder="Your name"></div><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></div><button class="submit" id="submit">Sign in ↗</button></form><div class="msg" id="msg"></div><div class="small">Your Starter projects are saved to your Nuvio account, so you can return from another device.</div><a class="back" href="index.html">← Back to Nuvio</a></main><script type="module">import {supabase} from './supabase.js';const $=s=>document.querySelector(s);let mode='signin';const next=new URLSearchParams(location.search).get('next')||'starter-projects.html';function setMode(m){mode=m;$('#signinTab').classList.toggle('active',m==='signin');$('#signupTab').classList.toggle('active',m==='signup');$('#nameWrap').style.display=m==='signup'?'grid':'none';$('#title').textContent=m==='signup'?'Create your Nuvio account.':'Welcome back.';$('#submit').textContent=m==='signup'?'Create account ↗':'Sign in ↗';$('#msg').textContent=''}$('#signinTab').onclick=()=>setMode('signin');$('#signupTab').onclick=()=>setMode('signup');$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#msg').textContent='Working…';const email=$('#email').value.trim(),password=$('#password').value;let result;if(mode==='signup'){result=await supabase.auth.signUp({email,password,options:{data:{name:$('#name').value.trim()}}})}else{result=await supabase.auth.signInWithPassword({email,password})}if(result.error){$('#msg').textContent=result.error.message;$('#submit').disabled=false;return}if(mode==='signup'&&!result.data.session){$('#msg').textContent='Account created. Check your email to confirm it, then sign in.';$('#submit').disabled=false;return}location.href=next};</script></body></html>
