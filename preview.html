<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starter Website Preview — Nuvio</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#12223a;font-family:Arial,Helvetica,sans-serif}.bar{position:sticky;top:0;z-index:5;height:58px;background:#102039;color:#fff;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;font-size:12px}.bar a{color:#fff;text-decoration:none;border:1px solid #51647d;border-radius:99px;padding:9px 14px}.site{max-width:1180px;margin:auto;background:#fff;min-height:100vh}.hero{padding:90px 8vw 75px;background:#e8f2ff}.warm{background:#f6e8d4}.dark{background:#142940;color:#fff}.eyebrow{font-size:10px;letter-spacing:.15em;opacity:.6}.hero h1{font-size:clamp(55px,9vw,115px);line-height:.82;letter-spacing:-.07em;margin:18px 0}.hero p{font-size:17px;line-height:1.6;max-width:680px;opacity:.7}.cta{display:inline-block;background:#146cff;color:#fff;border-radius:99px;padding:13px 18px;text-decoration:none;font-size:12px;font-weight:bold;margin-top:15px}.section{padding:75px 8vw}.section h2{font-size:clamp(35px,5vw,65px);letter-spacing:-.06em;margin:10px 0 25px}.section>p{max-width:720px;line-height:1.75;color:#66768b}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:30px}.item{border:1px solid #dce4ed;border-radius:17px;padding:24px;min-height:120px}.item b{font-size:16px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img{width:100%;height:240px;object-fit:cover;border-radius:15px;background:#e7edf4}.quote{font-size:22px;line-height:1.45;border-left:3px solid #146cff;padding-left:20px;margin:18px 0}.contact{background:#102039;color:#fff}.contact p{color:#aab8c9}.contact a{color:#fff}.empty-note{text-align:center;padding:100px 20px}.footer{padding:28px 8vw;border-top:1px solid #dce4ed;font-size:10px;color:#728198}@media(max-width:700px){.items,.gallery{grid-template-columns:1fr}.section{padding:55px 7vw}.hero{padding:65px 7vw}}
</style></head><body><div class="bar"><span>NUVIO STARTER / PREVIEW</span><a href="starter-projects.html">← My Projects</a></div><main id="app"></main><script>const q=new URLSearchParams(location.search).get('project');let p=[];try{p=JSON.parse(localStorage.getItem('nuvio-projects')||'[]')}catch{}const d=p.find(x=>x.slug===q);const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const list=s=>String(s||'').split('|').map(x=>x.trim()).filter(Boolean);if(!d){app.innerHTML='<div class="empty-note"><h1>Project not found</h1><p>Open My Projects and choose a saved Starter project.</p></div>'}else{const theme=d.theme==='dark'?'dark':d.theme==='warm'?'warm':'';const services=list(d.services),products=list(d.products),highlights=list(d.highlights),reviews=String(d.reviews||'').split('\n').map(x=>x.trim()).filter(Boolean),imgs=[d.image1,d.image2,d.image3].filter(Boolean);app.innerHTML=`<section class="hero ${theme}"><div class="eyebrow">${esc((d.businessType||'BUSINESS')+' / NUVIO STARTER')}</div><h1>${esc(d.businessName||'Your Business')}</h1><p><b>${esc(d.tagline||'')}</b><br>${esc(d.description||'A professional home for your business.')}</p><a class="cta" href="#contact">Contact the business ↗</a></section>${d.about?`<section class="section"><div class="eyebrow">ABOUT</div><h2>The story behind<br>${esc(d.businessName)}</h2><p>${esc(d.about)}</p></section>`:''}${services.length?`<section class="section"><div class="eyebrow">SERVICES</div><h2>What we do.</h2><div class="items">${services.map((x,i)=>`<div class="item"><b>0${i+1}</b><br><span>${esc(x)}</span></div>`).join('')}</div></section>`:''}${products.length?`<section class="section"><div class="eyebrow">PRODUCTS / PACKAGES</div><h2>Explore the offering.</h2><div class="items">${products.map(x=>`<div class="item"><b>${esc(x)}</b></div>`).join('')}</div></section>`:''}${highlights.length?`<section class="section"><div class="eyebrow">WHY US</div><h2>Reasons to choose us.</h2><div class="items">${highlights.map(x=>`<div class="item"><b>✓</b><br>${esc(x)}</div>`).join('')}</div></section>`:''}${imgs.length?`<section class="section"><div class="eyebrow">GALLERY</div><h2>A look at our work.</h2><div class="gallery">${imgs.map(x=>`<img src="${esc(x)}" alt="Business gallery image" onerror="this.style.display='none'">`).join('')}</div></section>`:''}${reviews.length?`<section class="section"><div class="eyebrow">CUSTOMER VOICES</div><h2>What customers say.</h2>${reviews.map(x=>`<div class="quote">“${esc(x)}”</div>`).join('')}</section>`:''}${d.extra?`<section class="section"><div class="eyebrow">MORE</div><h2>More from the business.</h2><p>${esc(d.extra)}</p></section>`:''}<section class="section contact" id="contact"><div class="eyebrow">CONTACT</div><h2>Let's talk.</h2><p>${esc(d.address||d.location||'')}<br>${esc(d.hours||'')}<br>${esc(d.email||'')}</p><p><b>Phone:</b> <a href="tel:${esc(d.phone)}">${esc(d.phone||'Not added')}</a><br><b>WhatsApp:</b> ${esc(d.whatsapp||d.phone||'Not added')}</p>${d.social?`<a class="cta" href="${esc(d.social)}" target="_blank">Visit social profile ↗</a>`:''}</section><footer class="footer">BUILT WITH NUVIO STARTER · ${esc(d.businessName)}</footer>`}</script></body></html>
