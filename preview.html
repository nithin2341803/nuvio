<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuvio Website</title>
  <meta name="robots" content="index,follow">
  <style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fc;color:#172033}#app{min-height:100vh} .loading{min-height:100vh;display:grid;place-items:center;color:#667085} .error{max-width:620px;margin:15vh auto;padding:32px;text-align:center;background:#fff;border:1px solid #e5eaf2;border-radius:24px}</style>
</head>
<body>
<div id="app"><div class="loading">Loading website…</div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient('https://nfsksehqhykiixnrzrdd.supabase.co','sb_publishable_YUdcqphJZWWbpFBb-RogcQ_z0XdOteP');
const params = new URLSearchParams(location.search);
const id = (params.get('p') || '').toUpperCase();
const app = document.getElementById('app');
if (!/^[A-Z0-9]{6}$/.test(id)) { app.innerHTML='<div class="error"><h1>Website not found</h1><p>The link is incomplete or invalid.</p></div>'; }
else {
  const { data, error } = await supabase.from('guest_starter_projects').select('business_name,slug,status,data').eq('project_code',id).eq('status','published').maybeSingle();
  if (error || !data) { app.innerHTML='<div class="error"><h1>Website not found</h1><p>This Nuvio website is unavailable.</p></div>'; }
  else {
    const d=data.data||{};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const wa=d.whatsapp?`https://wa.me/${String(d.whatsapp).replace(/\D/g,'')}`:'';
    const hero=d.heroImage||d.mainPhoto||'';
    const gallery=Array.isArray(d.gallery)?d.gallery.filter(Boolean):[];
    document.title=data.business_name||'Website';
    app.innerHTML=`<main style="max-width:1100px;margin:auto;padding:24px"><header style="display:flex;justify-content:space-between;align-items:center;padding:16px 0"><strong style="font-size:22px">${esc(data.business_name)}</strong>${wa?`<a href="${wa}" target="_blank" rel="noopener" style="padding:12px 18px;border-radius:999px;background:#1473ff;color:#fff;text-decoration:none">WhatsApp ↗</a>`:''}</header><section style="padding:80px 0;display:grid;gap:28px">${hero?`<img src="${esc(hero)}" alt="${esc(data.business_name)}" style="width:100%;max-height:560px;object-fit:cover;border-radius:28px">`:''}<div><p style="text-transform:uppercase;letter-spacing:.12em;color:#667085">${esc(d.businessType||'Business')}</p><h1 style="font-size:clamp(42px,8vw,84px);line-height:.95;margin:8px 0 20px">${esc(d.tagline||data.business_name)}</h1><p style="font-size:20px;line-height:1.6;color:#596579;max-width:760px">${esc(d.description||'Welcome to our business.')}</p></div></section>${gallery.length?`<section><h2>Our work</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">${gallery.map(x=>`<img src="${esc(x)}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px">`).join('')}</div></section>`:''}<section style="padding:80px 0"><h2>Get in touch</h2><p>${esc(d.email||'')}</p><p>${esc(d.location||'')}</p><p>${esc(d.hours||'')}</p>${wa?`<a href="${wa}" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px;padding:14px 22px;border-radius:999px;background:#1473ff;color:#fff;text-decoration:none">Talk to us ↗</a>`:''}</section></main>`;
  }
}
</script>
</body>
</html>
